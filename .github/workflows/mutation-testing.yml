name: Mutation Testing

# Informational only, not a required check — see "Why not just gate every PR today" in
# docs/ops/mutation-testing-runbook.md. Promote to required once real CI runtime and
# reliability are proven, the way `test.yml`'s backend/frontend jobs were.
on:
  pull_request:
    paths:
      - "src/utils/validators.py"
      - "src/services/jobs.py"
      - "tests/test_validators.py"
      - "tests/test_jobs_api.py"
      - "web/lib/feed-thumbnail-preload.ts"
      - "web/lib/job-detail-utils.ts"
      - "web/lib/parse-batch-links.ts"
      - "web/lib/polling.ts"
      - "web/lib/share-target.ts"
      - "web/lib/feed-thumbnail-preload.test.ts"
      - "web/lib/job-detail-utils.test.ts"
      - "web/lib/parse-batch-links.test.ts"
      - "web/lib/polling.test.ts"
      - "web/lib/share-target.test.ts"
      - "web/vitest.config.ts"
      - "cosmic-ray.toml"
      - "web/stryker.config.mjs"
      - "requirements-dev.txt"
      - "web/package.json"
      - "web/package-lock.json"
  # Weekly full-scope baseline sweep, unfiltered (ignores the paths list above — schedule/
  # workflow_dispatch always run the whole configured module-path/mutate scope) — feeds
  # docs/ops/mutation-score-history.md, which rabbitloop reads to flag regressions.
  # Cron is UTC-only, no DST: 00:00 UTC = 3am Israel Daylight Time (IDT); drifts to 2am
  # during Israel Standard Time (winter) since GitHub Actions can't express a tz-aware cron.
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend-mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # cr-filter-git diffs against the `main` branch set in cosmic-ray.toml — needs
          # that branch's full history present, not the default shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt cosmic-ray
      # checkout only leaves the PR ref locally — cr-filter-git needs a `main` ref it can diff
      # against. persist-credentials: false above means an unauthenticated fetch, which is fine
      # for this public repo but would fail on a private one — embed the job token in the fetch
      # URL so this keeps working if the repo's visibility ever changes.
      - run: |
          git fetch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" main:main
      # cr-filter-git skips mutants on lines unchanged vs. main, so a change that only touches
      # tests/test_validators.py / tests/test_jobs_api.py (no module-path source edits) would
      # otherwise get every mutant marked skipped and produce no real result — run unfiltered then.
      - id: source-changed
        run: |
          if git diff --name-only main...HEAD -- src/utils/validators.py src/services/jobs.py | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: cosmic-ray init cosmic-ray.toml session.sqlite
      - run: cr-filter-git --config cosmic-ray.toml session.sqlite
        if: steps.source-changed.outputs.changed == 'true'
      - run: cosmic-ray exec cosmic-ray.toml session.sqlite
      - run: cr-report session.sqlite | tee cosmic-ray-report.txt
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmic-ray-report
          path: cosmic-ray-report.txt

  frontend-mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @stryker-mutator/core ^10 requires Node >=22
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: web/reports/stryker-incremental.json
          # Incremental mode only tracks mutated/test files, not dependency or config changes
          # (Stryker docs), so the key folds in package-lock's hash — a lockfile bump forces a
          # fresh baseline instead of restoring stale incremental state from before the bump.
          key: stryker-incremental-${{ github.base_ref }}-${{ hashFiles('web/package-lock.json') }}-${{ github.sha }}
          restore-keys: stryker-incremental-${{ github.base_ref }}-${{ hashFiles('web/package-lock.json') }}-
      # clear-text reporter prints a `| All files | <score> | ... |` row to stdout — the only
      # place Stryker exposes the aggregate score without hand-computing it from mutation.json's
      # raw per-mutant records. Capture it so rabbitloop can read the score on a passing run too,
      # not just dig through the report when the gate fails.
      - run: |
          set -o pipefail
          npx stryker run 2>&1 | tee stryker-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: |
            web/reports/mutation/
            web/stryker-run.log

  # Weekly full-scope snapshot (Fridays ~3am Israel time) or a manual workflow_dispatch run.
  # One job, backend steps then frontend steps in order — not the parallel PR jobs above —
  # because this run's purpose is a single coherent history-file row for both, not fast PR
  # feedback (the two PR jobs above already run in parallel; splitting isolated GH-hosted
  # runners doesn't actually contend for memory the way running both on one dev machine does
  # — see the runbook's "don't run both tools at once" gotcha, which is about that machine,
  # not CI). No cr-filter-git and no Stryker incremental cache here: this snapshot exists to
  # score the whole configured scope from scratch, not to diff against a base branch.
  weekly-mutation-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A manual workflow_dispatch overlapping the Friday schedule (or two manual runs) would
    # otherwise race to commit+push docs/ops/mutation-score-history.md — queue instead of
    # canceling, since each run's ~30min of real mutation-testing work shouldn't be thrown away.
    concurrency:
      group: weekly-mutation-history
      cancel-in-progress: false
    permissions:
      contents: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Explicit ref, not github.ref: a workflow_dispatch run started from any other branch
          # must still snapshot and commit against main, never that branch. No persist-credentials:
          # false here, unlike the PR jobs above — this job needs the default authenticated remote
          # to push the history commit back.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt cosmic-ray
      - run: cosmic-ray init cosmic-ray.toml session.sqlite
      - run: cosmic-ray exec cosmic-ray.toml session.sqlite
      - run: cr-report session.sqlite | tee cosmic-ray-report.txt
      - id: backend-score
        run: |
          TOTAL=$(grep -oP 'total jobs: \K\d+' cosmic-ray-report.txt)
          SURVIVED=$(grep -oP 'surviving mutants: \K\d+' cosmic-ray-report.txt)
          KILLED=$((TOTAL - SURVIVED))
          SCORE=$(awk -v k="$KILLED" -v t="$TOTAL" 'BEGIN { printf "%.2f", (t > 0 ? k / t * 100 : 0) }')
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "killed=$KILLED" >> "$GITHUB_OUTPUT"
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # @stryker-mutator/core ^10 requires Node >=22
      - working-directory: web
        run: npm ci
      - id: frontend-score
        working-directory: web
        run: |
          # This snapshot's whole job is recording the score, low or high — a below-threshold
          # score must not abort the script before it's parsed and appended. bash's default -e
          # (GitHub Actions runs steps as `bash -e`) would otherwise kill the script the instant
          # `npx stryker run` exits non-zero, skipping every line below including the history
          # commit. Capture the exit status without acting on it; only a missing score table
          # (Stryker crashed before producing one) is treated as a real failure.
          set +e
          npx stryker run 2>&1 | tee stryker-run.log
          set -e
          # clear-text score table row: File | % score | # killed | # timeout | # survived | # no cov | # error
          LINE=$(grep -m1 '^All files' stryker-run.log)
          if [ -z "$LINE" ]; then
            echo "No score table in stryker-run.log — Stryker crashed, not just a low score." >&2
            exit 1
          fi
          SCORE=$(echo "$LINE" | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          KILLED=$(echo "$LINE" | awk -F'|' '{gsub(/ /,"",$3); print $3}')
          TIMEOUT=$(echo "$LINE" | awk -F'|' '{gsub(/ /,"",$4); print $4}')
          SURVIVED=$(echo "$LINE" | awk -F'|' '{gsub(/ /,"",$5); print $5}')
          NOCOV=$(echo "$LINE" | awk -F'|' '{gsub(/ /,"",$6); print $6}')
          TOTAL=$((KILLED + TIMEOUT + SURVIVED + NOCOV))
          echo "score=$SCORE" >> "$GITHUB_OUTPUT"
          echo "killed=$KILLED" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-mutation-reports
          path: |
            cosmic-ray-report.txt
            web/reports/mutation/
            web/stryker-run.log
      - run: |
          # The mutation runs above take ~30min — re-sync with whatever main has become in the
          # meantime before appending, so the push below is against a fresh tip instead of racing
          # a stale one (the concurrency group above only serializes overlapping runs of this job,
          # it doesn't protect against main moving from an unrelated push).
          git fetch origin main
          git reset --hard origin/main
          DATE=$(date -u +%Y-%m-%d)
          SHA=$(git rev-parse --short HEAD)
          ROW="| $DATE | $SHA | ${{ steps.backend-score.outputs.score }}% | ${{ steps.backend-score.outputs.killed }}/${{ steps.backend-score.outputs.total }} | ${{ steps.frontend-score.outputs.score }}% | ${{ steps.frontend-score.outputs.killed }}/${{ steps.frontend-score.outputs.total }} |"
          echo "$ROW" >> docs/ops/mutation-score-history.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ops/mutation-score-history.md
          git commit -m "chore: record weekly mutation score ($DATE)"
          git push origin HEAD:main
