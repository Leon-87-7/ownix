<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ownix Capture — Options</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 40px auto;
        padding: 0 16px;
        background: #0d0e10;
        color: #f4f1eb;
      }
      label {
        display: block;
        margin-bottom: 12px;
        font-size: 14px;
      }
      input {
        width: 100%;
        margin-top: 6px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #30343d;
        background: #16181c;
        color: #f4f1eb;
      }
      button {
        padding: 8px 16px;
        background: #d99a45;
        color: #1b1309;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 13px;
        color: #948e84;
      }
    </style>
  </head>
  <body>
    <h1>Ownix Capture</h1>
    <label>
      Ownix host
      <input
        id="host"
        type="url"
        placeholder="https://app.leondev.xyz"
      />
    </label>
    <button id="save">Save host</button>
    <p id="status"></p>

    <h2>Pairing</h2>
    <p id="connection-status">Checking connection…</p>
    <label>
      Pairing code
      <input
        id="pairing-code"
        type="text"
        placeholder="Paste the code from Settings → Extensions"
      />
    </label>
    <button id="pair">Connect</button>
    <button
      id="disconnect"
      type="button"
    >
      Disconnect
    </button>
    <p id="pairing-status"></p>
    <script
      type="module"
      src="src/options.js"
    ></script>
  </body>
</html>
